<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Lunar Landing Site Navigator">
  <defs>
    <radialGradient id="moon" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e9e9ee"/>
      <stop offset="0.55" stop-color="#9a9ca6"/>
      <stop offset="1" stop-color="#3a3c43"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="1010" cy="150" r="118"/></clipPath>
  </defs>
  <rect width="1200" height="300" fill="#000"/>
  <!-- stars (decorative) -->
  <g fill="#f0f0fa">
    <circle cx="70" cy="40" r="1"/><circle cx="160" cy="250" r="1.2"/><circle cx="300" cy="30" r="0.8"/><circle cx="420" cy="270" r="1"/>
    <circle cx="560" cy="45" r="1.1"/><circle cx="640" cy="255" r="0.9"/><circle cx="760" cy="28" r="1"/><circle cx="820" cy="270" r="1.3"/>
    <circle cx="240" cy="140" r="0.7"/><circle cx="690" cy="150" r="0.8"/><circle cx="880" cy="60" r="0.9"/><circle cx="1160" cy="270" r="1"/>
    <circle cx="1170" cy="30" r="0.8"/><circle cx="500" cy="160" r="0.6"/><circle cx="30" cy="200" r="0.9"/>
  </g>
  <!-- the Moon, lit from the left, with the south pole toward the viewer's bottom -->
  <g clip-path="url(#disc)">
    <circle cx="1010" cy="150" r="118" fill="url(#moon)"/>
    <g fill="#5e6068" opacity="0.55">
      <circle cx="975" cy="110" r="14"/><circle cx="1040" cy="190" r="22"/><circle cx="960" cy="200" r="9"/>
      <circle cx="1060" cy="105" r="11"/><circle cx="1005" cy="245" r="16"/><circle cx="930" cy="150" r="7"/>
    </g>
    <rect x="892" y="32" width="236" height="236" fill="url(#shade)"/>
  </g>
  <!-- Sun and Earth: the two colours of the navigator -->
  <circle cx="850" cy="62" r="9" fill="#f0b254"/>
  <circle cx="850" cy="62" r="16" fill="none" stroke="#f0b254" stroke-opacity="0.35"/>
  <circle cx="1160" cy="236" r="10" fill="#6fb1e6"/>
  <path d="M1150 236a10 10 0 0 0 20 0z" fill="#16324a"/>
  <!-- the chosen place: the navigator's reticle -->
  <g stroke="#fff" fill="none" stroke-width="2">
    <circle cx="1008" cy="236" r="9"/>
    <path d="M1008 222v-6M1008 250v6M994 236h-6M1022 236h6"/>
  </g>
  <!-- title -->
  <g font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#f0f0fa">
    <text x="60" y="118" font-size="44" font-weight="700" letter-spacing="7">LUNAR LANDING</text>
    <text x="60" y="170" font-size="44" font-weight="700" letter-spacing="7">SITE NAVIGATOR</text>
    <text x="62" y="214" font-size="18" fill="#9a9ca6" letter-spacing="1">Sun, Earth and terrain for any place and any date on the Moon</text>
    <text x="62" y="252" font-size="14" fill="#9a9ca6" letter-spacing="3">NASA SPACE APPS CHALLENGE 2026 · TEAM BOPE</text>
  </g>
  <rect x="62" y="232" width="40" height="2" fill="#f0b254"/>
  <rect x="106" y="232" width="40" height="2" fill="#6fb1e6"/>
</svg>
